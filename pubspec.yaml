name: flag_admin_web
description: "Admin Web do Flag Platform - gestao de cadastros pelo organizador (Flutter Web)."
version: 0.4.0
publish_to: none

environment:
  sdk: ^3.11.4

workspace:
  - packages/*

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  flag_core: ^0.3.0
  flag_api: ^0.3.0
  flag_domain: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: flag_core
description: "Núcleo compartilhado dos apps do Flag Platform: tema, widgets de estado, configuração e sessão."
version: 0.3.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flag_domain:
    path: ../domain
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  google_fonts: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


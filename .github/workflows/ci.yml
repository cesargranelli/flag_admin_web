# CI desativado temporariamente
#
# Este workflow está INATIVO de propósito. O projeto flag_admin_web NÃO é um
# workspace Melos, então `melos bootstrap` sempre falha (todas as runs até
# aqui terminaram em failure).
#
# Decisão do time (2026-09-04): CI será revisitado/reativado quando o projeto
# estiver mais maduro. Para reativar, restaure os gatilhos abaixo:
#
# on:
#   pull_request:
#     types: [opened, synchronize, reopened]
#   push:
#     branches: [main, develop]

name: CI

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          version: '3.41.6'
          cache: true

      - name: Ativar melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Analyze
        run: melos analyze
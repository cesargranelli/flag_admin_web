name: Deploy Docs (GitHub Pages)

on:
  # Deploy manual: executar a partir da aba Actions do GitHub.
  workflow_dispatch:

# Permissões exigidas pelo actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy por vez.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy documentação
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato (docs/pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4